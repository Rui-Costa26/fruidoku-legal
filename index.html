<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fruidoku</title>
<style>
  :root { color-scheme: light dark; --bg:#EEF4EE; --card:#ffffff; --fg:#1C2B23; --muted:#56685D; --accent:#2E7D4F; --line:#d5e2d7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101814; --card:#18231D; --fg:#E7F0E9; --muted:#A3B5A9; --accent:#5CC58A; --line:#2a3a31; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:42rem; margin:0 auto; padding:2.5rem 1rem 4rem; }
  h1 { font-size:2rem; margin:0 0 .25rem; }
  h2 { font-size:1.2rem; margin:2rem 0 .5rem; color:var(--accent); }
  p, li { margin:.5rem 0; }
  .meta { color:var(--muted); font-size:.95rem; }
  .summary { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1rem 1.25rem; margin:1.5rem 0; }
  a { color:var(--accent); }
</style>
</head>

<main>

<h1>Fruidoku</h1>
<p>A fruit-themed logic puzzle game for iPhone.</p>
